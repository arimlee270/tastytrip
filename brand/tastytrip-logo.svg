<!--
  TastyTrip 가로형 로고 — 마크 + 이름. 발표 자료 표지에 쓰기 좋다.

  글자는 path 가 아니라 text 라서, 여는 쪽에 Inter 가 없으면 다른 글꼴로
  보인다. PPT 에는 같은 폴더의 PNG 를 쓰는 편이 안전하다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110">
  <defs>
    <linearGradient id="tt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f05a32"/>
      <stop offset="1" stop-color="#ff7b4f"/>
    </linearGradient>
  </defs>

  <!-- 마크 (0,0)-(100,100) -->
  <g transform="translate(4 5)">
    <rect x="0" y="8" width="92" height="92" rx="26" fill="url(#tt)"/>
    <g transform="translate(24 32) scale(1.83333)"
       fill="none" stroke="#ffffff" stroke-width="2.2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
      <path d="M7 2v20"/>
      <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
    </g>
    <circle cx="82" cy="18" r="18" fill="#ffffff" stroke="#e8d5cd" stroke-width="0.8"/>
    <g transform="translate(74 10) scale(0.66667)"
       fill="none" stroke="#f05a32" stroke-width="2.6"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
    </g>
  </g>

  <!-- 이름 — 앱의 인트로 화면과 같이 Tasty 는 먹색, Trip 은 주황 -->
  <text x="124" y="73" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="54" font-weight="900" letter-spacing="-1.6">
    <tspan fill="#241815">Tasty</tspan><tspan fill="#f05a32">Trip</tspan>
  </text>
</svg>
