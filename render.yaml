# Render 배포 설정
#
# 저장소를 Render 에 연결하면 이 파일을 읽어 자동으로 설정을 잡는다.
# 화면에서 하나씩 입력해도 되지만, 파일로 두면 설정이 코드와 함께 기록되고
# 다시 배포할 때 같은 조건이 보장된다.
#
# 키(secret) 값은 여기에 적지 않는다. Render 대시보드의 Environment 에 직접 넣는다.
# 아래 sync: false 가 "이 값은 파일이 아니라 대시보드에서 받는다"는 뜻이다.

services:
  - type: web
    name: tastytrip
    runtime: node
    plan: free
    region: singapore # 한국에서 가장 가까운 무료 지역
    branch: main

    buildCommand: npm ci && npm run build
    startCommand: npm start

    # 서버가 살아 있는지 Render 가 확인하는 주소
    healthCheckPath: /api/config

    envVars:
      - key: NODE_ENV
        value: production

      # ── AI 분석 ──
      - key: GEMINI_API_KEY
        sync: false

      # ── 로그인 ──
      # JWT_SECRET 은 Render 가 임의의 긴 문자열을 만들어 넣는다.
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false

      # ── 데이터베이스 ──
      # Render 무료 플랜은 디스크가 없으므로 Turso(원격 DB)가 반드시 필요하다.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

      # ── 지도 ──
      # 서버 키: 식당 검색·상세조회. 브라우저로 나가지 않는다.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # 브라우저 키: 지도 그리기. 접속자 누구나 볼 수 있으므로
      # Cloud Console 에서 배포 주소로 리퍼러 제한을 걸어 둘 것.
      - key: GOOGLE_MAPS_BROWSER_KEY
        sync: false

      # ── 공공 데이터 ──
      - key: MFDS_SERVICE_KEY
        sync: false
      - key: USDA_API_KEY
        sync: false

      # ── 이미지 검색 ──
      - key: PEXELS_API_KEY
        sync: false

      # ── 운영 ──
      # 공개 데이터 동기화 엔드포인트 보호용. 없으면 해당 기능이 차단된다.
      - key: ADMIN_TOKEN
        generateValue: true
      # 분당 허용 요청 수 (메뉴 분석 등 유료 호출 보호)
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
