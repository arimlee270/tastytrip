<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 폰에서 주소창을 빼고 앱처럼 띄우기 위해 확대를 막고 안전영역까지 채운다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>TastyTrip</title>
    <meta name="description" content="여행지 메뉴판을 찍으면 일행 각자의 알레르기·식단 조건에 맞는지 알려줍니다." />
    <meta name="theme-color" content="#f05a32" />

    <!-- 홈 화면에 추가했을 때 쓰는 이름 -->
    <meta name="apple-mobile-web-app-title" content="TastyTrip" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- 링크를 메신저로 보냈을 때 보이는 정보 -->
    <meta property="og:title" content="TastyTrip" />
    <meta property="og:description" content="여행지 메뉴판을 찍으면 일행 각자의 알레르기·식단 조건에 맞는지 알려줍니다." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
